name: Python compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            setup.py
      - name: Install package and available model backends
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.python-version }}" = "3.15" ]; then
            # CatBoost has no cp315 wheel yet; retain its full coverage below 3.15.
            python -m pip install ".[xgboost,lightgbm]" pytest setuptools
          else
            python -m pip install ".[all]" pytest setuptools
          fi
          python -m pip check
      - name: Test the installed package
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import xgboost, lightgbm; from qshap._backend import cpp_available; assert cpp_available()"
          if [ "${{ matrix.python-version }}" != "3.15" ]; then
            python -c "import catboost"
          fi
          python -m pytest "$GITHUB_WORKSPACE/tests" --import-mode=importlib -ra
      - name: Build full API documentation
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install ".[docs]"
          python -m sphinx -W --keep-going -b html docs docs/_build/html
